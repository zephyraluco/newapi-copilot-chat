name: Release

# Runs on version tags only (e.g. `git tag v0.0.2 && git push origin v0.0.2`). Builds the
# vsix and attaches it to a GitHub Release of the same name; plain commits and PRs
# are covered by ci.yml instead.
on:
  push:
    tags: ['v*']

# checkout reads the repository and the Release step writes to it; nothing else is needed.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Release is named after the tag, but the vsix version comes from
      # package.json. A mismatch would ship a mislabeled Release, so fail here.
      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the package.json version $pkg; bump the version to $tag first"
            exit 1
          fi
          echo "Version check passed: $pkg"

      # This artifact reaches users as-is, so run every constraint first.
      # `npm run package` triggers vscode:prepublish (types + lint + esbuild),
      # so only the layering rules are left to add here.
      - name: Check layering
        run: npm run check-layering

      - name: Package vsix
        run: npm run package

      # Keep both: the artifact belongs to this run, the Release is the long-lived
      # download — artifacts expire after 14 days.
      - name: Upload vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: newapi-copilot-chat-vsix
          path: '*.vsix'
          retention-days: 14

      # Last step: everything above either produced the vsix or failed, so the
      # artifact is final here.
      - name: Publish to GitHub Releases
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A re-run finds the Release already there; replace the asset.
            gh release upload "$GITHUB_REF_NAME" ./*.vsix --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./*.vsix \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
        env:
          # gh reads GH_TOKEN, injected by Actions and scoped to this repository.
          GH_TOKEN: ${{ github.token }}
