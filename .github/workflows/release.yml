name: Release

# 只在推送版本 tag 时触发（例如 `git tag v0.0.2 && git push origin v0.0.2`）。
# 普通提交与 PR 不进这个工作流，它们只走 ci.yml 的编译检查。
on:
  push:
    tags: ['v*']

# 发布只需要读取仓库内容，其余权限一律不给。
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      # vsix 的版本号取自 package.json，而 Marketplace 上同一版本只能发布一次
      # （已存在的版本无法覆盖，只能下架后重发）。tag 与 package.json 不一致时
      # 多半是想发新版本却忘了改 package.json —— 这里直接拦下，别把旧版本发上去。
      - name: 校验 tag 与 package.json 版本一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 的版本号 $pkg 不一致；请先把 package.json 的 version 改成 $tag"
            exit 1
          fi
          echo "版本校验通过：$pkg"

      # 发布是单向操作，所以发布前把整套约束跑齐。
      # 注意：`npm run package` 会触发 vscode:prepublish（类型 + lint + esbuild），
      # 因此这里只需要补上它不含的分层约束，不必重复跑类型与 lint。
      - name: 分层约束
        run: npm run check-layering

      - name: 打包 vsix
        run: npm run package

      # 先留下产物再发布：即使发布失败（例如 PAT 过期），这次构建的 vsix 仍然拿得到。
      - name: 上传 vsix
        uses: actions/upload-artifact@v4
        with:
          name: newapi-copilot-chat-vsix
          path: '*.vsix'
          retention-days: 14

      - name: 发布到 VS Code Marketplace
        run: |
          npx vsce publish \
            --packagePath ./*.vsix \
            --allow-missing-repository
        env:
          # 在仓库 Settings → Secrets and variables → Actions 里配置；
          # 这是 Azure DevOps 的个人访问令牌（Marketplace 的发布凭据），不是 GitHub token。
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
