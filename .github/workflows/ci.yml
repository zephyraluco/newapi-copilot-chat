name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 类型 + 分层约束（谁可以依赖宿主）+ 文档里的统计数字
      - name: 约束检查
        run: npm run check

      - name: Lint
        run: npm run lint

      # 先跑不需要扩展宿主的那部分：几百毫秒出结果，不必等 VS Code 下载
      - name: 纯逻辑测试
        run: npm run test:unit

      # 其余测试跑在真实 VS Code 测试宿主里，Linux 上需要虚拟显示
      - name: 测试
        run: xvfb-run -a npm test

      - name: 打包
        run: npm run package

      - name: 上传 vsix
        uses: actions/upload-artifact@v4
        with:
          name: newapi-copilot-chat-vsix
          path: '*.vsix'
          retention-days: 14
