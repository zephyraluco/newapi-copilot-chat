name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Types + lint + bundle. The vsix is packaged on tags, by release.yml.
      - name: Compile
        run: npm run compile

      # Unit tests of the pure layers. They bundle the sources on the fly, so they need
      # no build step of their own.
      - name: Test
        run: npm test

      # Layering rules, which `compile` does not cover: who may import the VS Code runtime.
      - name: Check layering
        run: npm run check-layering
