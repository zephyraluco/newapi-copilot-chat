name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 类型 + lint + 编译出产物。这里不打包 vsix：那件事在打 tag 时由 release.yml 做。
      - name: 编译
        run: npm run compile

      # 分层约束：谁可以依赖 VS Code 运行时（compile 里不包含这一项）
      - name: 分层约束
        run: npm run check-layering
